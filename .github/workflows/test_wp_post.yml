name: Test WordPress Email Posting (Connectivity Verification)

on:
  workflow_dispatch:

jobs:
  test-posting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute WP Post by Email Test
        env:
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL || 'https://seda68.wordpress.com' }}
        run: |
          python tools/test_wp_post.py
